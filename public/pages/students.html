<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members - Library Management System</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
<aside class="sidebar">

    <div class="sidebar-logo">
        📚 <span>Library System</span>
    </div>

    <nav class="sidebar-menu">

        <a href="/dashboard">
            🏠 Dashboard
        </a>

        <a href="/pages/books.html">
            📚 Books
        </a>

      <a href="/pages/students.html" class="active">
    👨‍🎓 Members
</a>

        <a href="/pages/categories.html">
            🗂️ Categories
        </a>

        <a href="/pages/issues.html">
            🔄 Issue / Return
        </a>

        <a href="/reports">
            📊 Reports
        </a>

    </nav>

    <div class="sidebar-bottom">
        <button onclick="logout()" class="sidebar-logout">
            🚪 Logout
        </button>
    </div>

</aside>
<div class="dashboard">

    <header class="topbar">
        <div>
            <h1>📚 Library Management System</h1>
            <p>Member Management</p>
        </div>

        <button class="logout-btn" onclick="logout()">Logout</button>
    </header>

    <main class="dashboard-content">

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;">
            <h2>Library Members</h2>

            <button class="login-btn"
                    style="width:auto;padding:10px 20px;"
                    onclick="showForm()">
                + Add Member
            </button>
        </div>


        <!-- Add Member Form -->

        <div id="memberFormContainer"
             class="stat-card"
             style="display:none;margin-bottom:25px;">

            <h2 style="margin-bottom:20px;">Add Member</h2>

            <form id="memberForm">

                <div class="form-group">
                    <label>Student ID</label>
                    <input type="text" id="student_id" required>
                </div>

                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="name" required>
                </div>

                <div class="form-group">
                    <label>Department</label>
                    <input type="text" id="department">
                </div>

                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" id="phone">
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email">
                </div>

                <button type="submit" class="login-btn">
                    Save Member
                </button>

                <button type="button"
                        onclick="hideForm()"
                        style="margin-top:10px;width:100%;padding:12px;border:none;border-radius:6px;cursor:pointer;">
                    Cancel
                </button>

                <p id="formMessage" class="error-message"></p>

            </form>

        </div>


        <!-- Search -->

        <div class="stat-card" style="margin-bottom:25px;">

            <input
                type="text"
                id="searchInput"
                placeholder="Search by student ID or name..."
                style="width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:6px;"
            >

        </div>


        <!-- Members Table -->

        <div class="stat-card">

            <div style="overflow-x:auto;">

                <table style="width:100%;border-collapse:collapse;">

                    <thead>
                        <tr>
                            <th style="text-align:left;padding:12px;">ID</th>
                            <th style="text-align:left;padding:12px;">Student ID</th>
                            <th style="text-align:left;padding:12px;">Name</th>
                            <th style="text-align:left;padding:12px;">Department</th>
                            <th style="text-align:left;padding:12px;">Phone</th>
                            <th style="text-align:left;padding:12px;">Email</th>
                            <th style="text-align:left;padding:12px;">Actions</th>
                        </tr>
                    </thead>

                    <tbody id="membersTableBody"></tbody>

                </table>

            </div>

        </div>

    </main>

</div>


<script>

let members = [];


async function loadMembers() {

    try {

        const response = await fetch("/api/students");

        if (!response.ok) {
            throw new Error("Failed to load members");
        }

        members = await response.json();

        displayMembers(members);

    } catch (error) {

        console.error(error);

        document.getElementById("membersTableBody").innerHTML =
            `<tr>
                <td colspan="7" style="padding:20px;text-align:center;">
                    Unable to load members.
                </td>
            </tr>`;
    }
}


function displayMembers(memberList) {

    const tbody = document.getElementById("membersTableBody");

    tbody.innerHTML = "";

    if (memberList.length === 0) {

        tbody.innerHTML =
            `<tr>
                <td colspan="7" style="padding:20px;text-align:center;">
                    No members found.
                </td>
            </tr>`;

        return;
    }


    memberList.forEach(member => {

        const row = document.createElement("tr");

        row.innerHTML = `
            <td style="padding:12px;">${member.id}</td>
            <td style="padding:12px;">${member.student_id}</td>
            <td style="padding:12px;">${member.name}</td>
            <td style="padding:12px;">${member.department || "-"}</td>
            <td style="padding:12px;">${member.phone || "-"}</td>
            <td style="padding:12px;">${member.email || "-"}</td>

            <td style="padding:12px;">

                <button
                    onclick="editMember(${member.id})"
                    style="background:#2563eb;color:white;border:none;padding:7px 12px;border-radius:5px;cursor:pointer;margin-right:5px;">
                    Edit
                </button>

                <button
                    onclick="deleteMember(${member.id})"
                    style="background:#dc2626;color:white;border:none;padding:7px 12px;border-radius:5px;cursor:pointer;">
                    Delete
                </button>

            </td>
        `;

        tbody.appendChild(row);

    });
}


document.getElementById("memberForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const memberData = {

        student_id: document.getElementById("student_id").value,

        name: document.getElementById("name").value,

        department: document.getElementById("department").value,

        phone: document.getElementById("phone").value,

        email: document.getElementById("email").value

    };


    try {

        const response = await fetch("/api/students", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(memberData)

        });


        const data = await response.json();


        if (!response.ok) {

            document.getElementById("formMessage").textContent =
                data.message || "Unable to add member.";

            return;
        }


        document.getElementById("memberForm").reset();

        hideForm();

        loadMembers();

    } catch (error) {

        console.error(error);

        document.getElementById("formMessage").textContent =
            "Server error.";

    }

});


function editMember(id) {

    const member = members.find(member => member.id === id);

    if (!member) return;


    const student_id = prompt("Student ID:", member.student_id);
    if (student_id === null) return;

    const name = prompt("Name:", member.name);
    if (name === null) return;

    const department = prompt("Department:", member.department || "");
    if (department === null) return;

    const phone = prompt("Phone:", member.phone || "");
    if (phone === null) return;

    const email = prompt("Email:", member.email || "");
    if (email === null) return;


    updateMember(
        id,
        student_id,
        name,
        department,
        phone,
        email
    );
}


async function updateMember(
    id,
    student_id,
    name,
    department,
    phone,
    email
) {

    try {

        const response = await fetch(`/api/students/${id}`, {

            method: "PUT",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                student_id,
                name,
                department,
                phone,
                email
            })

        });


        const data = await response.json();


        if (!response.ok) {

            alert(data.message || "Unable to update member.");

            return;
        }


        loadMembers();

    } catch (error) {

        console.error(error);

        alert("Server error.");

    }

}


async function deleteMember(id) {

    if (!confirm("Are you sure you want to delete this member?")) {
        return;
    }


    try {

        const response = await fetch(`/api/students/${id}`, {
            method: "DELETE"
        });


        const data = await response.json();


        if (!response.ok) {

            alert(data.message || "Unable to delete member.");

            return;
        }


        loadMembers();

    } catch (error) {

        console.error(error);

        alert("Server error.");

    }

}


document.getElementById("searchInput").addEventListener("input", function() {

    const search = this.value.toLowerCase();

    const filteredMembers = members.filter(member =>
        member.student_id.toLowerCase().includes(search) ||
        member.name.toLowerCase().includes(search)
    );

    displayMembers(filteredMembers);

});


function showForm() {
    document.getElementById("memberFormContainer").style.display = "block";
}


function hideForm() {

    document.getElementById("memberFormContainer").style.display = "none";

    document.getElementById("formMessage").textContent = "";

}


async function logout() {

    await fetch("/logout", {
        method: "POST"
    });

    window.location.href = "/";

}


loadMembers();

</script>
</body>
</html>
